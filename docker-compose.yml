# The whole system on one host: PostgreSQL ← PgBouncer ← N api replicas, the worker, Redis, the dashboard,
# and nginx in front (/graphql and /health → api, everything else → dashboard). Guides: docs/17-scaling.md,
# docs/18-updates.md.
#
#   cp .env.example .env                        # set JWT_SECRET, CORS_ORIGINS, POSTGRES_PASSWORD, …
#   docker compose up -d                         # pulls the released images; http://localhost:8080
#   docker compose up -d --scale api=4           # more or fewer api replicas, at any time
#
# Updating: set MGPL_API_VERSION / MGPL_DASHBOARD_VERSION in .env (default "latest"), then
#   docker compose pull && docker compose up -d
# db-sync adds new tables first; the replicas restart after it. Owners and admins see new releases in the
# dashboard (Updates).
#
# Building the api from this checkout instead of pulling it:
#   NODE_AUTH_TOKEN=… docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The api and the worker read .env too; the values below (database, Redis, proxy) win over it, because the
# services find each other by name inside this network.
name: mgpl

# api, worker and db-sync run the same image (three commands)
x-api: &api
  image: ${MGPL_API_IMAGE:-ghcr.io/mgpl-diagnostics/api}:${MGPL_API_VERSION:-latest}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    db-sync: { condition: service_completed_successfully }
    pgbouncer: { condition: service_started }
    redis: { condition: service_healthy }
  # real signatures for reports and invoices: mount them read-only and set MGPL_SIGNATURE_*_FILE in .env
  # volumes: ["/secure/mgpl-signatures:/secure:ro"]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mgpl
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    # PgBouncer keeps the connections to PostgreSQL few; this only has to cover its pool plus db-sync and admin
    command: postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mgpl"]
      interval: 5s
      retries: 20

  # Connection pooler: every api replica and worker connects here, not to PostgreSQL. Transaction pooling
  # (the default) gives a server connection to a client only for the length of one transaction.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mgpl
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 6432
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-0}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-50}
      ADMIN_USERS: postgres
    depends_on:
      postgres: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: queued emails and sessions survive a Redis restart
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # Creates missing tables once per `up`, straight on PostgreSQL, before any replica starts (they run with DB_SYNC=false).
  db-sync:
    image: ${MGPL_API_IMAGE:-ghcr.io/mgpl-diagnostics/api}:${MGPL_API_VERSION:-latest}
    env_file:
      - path: .env
        required: false
    environment:
      DB_BACKEND: pg
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/mgpl
    command: ["node", "dist/sync.js"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *api
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DB_BACKEND: pg
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/mgpl
      DB_SYNC: "false"
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      # nginx below is the one proxy in front of the replicas (add one per proxy in front of nginx)
      TRUST_PROXY: ${TRUST_PROXY:-1}
    deploy:
      replicas: ${API_REPLICAS:-2}
    # docker compose stop: SIGTERM, then SIGKILL after this; longer than SHUTDOWN_DRAIN_MS + SHUTDOWN_TIMEOUT_MS
    stop_grace_period: 40s

  worker:
    <<: *api
    command: ["node", "dist/worker.js"]
    environment:
      DB_BACKEND: pg
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/mgpl
      DB_SYNC: "false"
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
    healthcheck:
      disable: true
    stop_grace_period: 40s

  # The staff dashboard (mgpl-diagnostics/dashboard). The browser reaches it and the api through nginx on one
  # origin, so no CORS and one trusted proxy (TRUST_PROXY=1). MGPL_API_URL is only for its own /graphql fallback.
  dashboard:
    image: ${MGPL_DASHBOARD_IMAGE:-ghcr.io/mgpl-diagnostics/dashboard}:${MGPL_DASHBOARD_VERSION:-latest}
    restart: unless-stopped
    environment:
      MGPL_API_URL: http://api:4000
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes: [./deploy/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [api, dashboard]

volumes:
  pgdata:
  redisdata:
