# The load balancer in docker-compose.yml: spreads requests over every `api` replica.
# Docker's DNS (127.0.0.11) answers "api" with one address per replica; resolving through a variable makes
# nginx re-resolve every 10 s, so `docker compose up --scale api=N` needs no restart here.
# TLS: terminate it here (listen 443 ssl + certificates) or in front of it (a CDN or a cloud load balancer);
# then count that proxy too in TRUST_PROXY.
events {}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  access_log off;
  # the api's BODY_LIMIT_BYTES (2 MB) plus room
  client_max_body_size 3m;

  server {
    listen 80;

    location / {
      set $api http://api:4000;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # one trusted hop: TRUST_PROXY=1 on the api reads the right-most entry, the address nginx saw
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # a replica that is shutting down answers 503: try the next one (nginx never retries a POST that reached a replica)
      proxy_next_upstream error timeout http_502 http_503;
      proxy_read_timeout 120s;
    }
  }
}
