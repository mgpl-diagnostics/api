name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id "ci" is the required status check on main (see mgpl-diagnostics/.github scripts/protect-repos.mjs).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the worker suite runs the API and a BullMQ worker against this Redis
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # The kits come from GitHub Packages at the versions pinned in package-lock.json.
      # (`npm run kits` still builds unreleased kit branches from source for local testing.)
      - uses: mgpl-diagnostics/.github/actions/node@main
        with:
          github-packages: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          install: npm ci --no-audit --no-fund
          mongodb: "true"
      - run: npm run typecheck
      # the [pgbouncer] and [replicas] checks run the API through PgBouncer in transaction mode
      # from cached .debs, so a mirror outage no longer holds the run (it once failed after five minutes)
      - uses: mgpl-diagnostics/.github/actions/apt@main
        with:
          packages: pgbouncer
      - name: End-to-end tests (GraphQL over HTTP, tokens, worker on Redis, client SDK) on PostgreSQL, PostgreSQL through PgBouncer and MongoDB
        run: npm test
        env:
          REDIS_URL: redis://localhost:6379
          PGBOUNCER_BIN: /usr/sbin/pgbouncer
      - run: npm run build
      - name: schema.graphql is up to date (run `npm run schema` and commit if this fails)
        run: npm run schema && git diff --exit-code -- schema.graphql
      - name: docs/04-api-reference.md is up to date (run `npm run docs:reference` and commit if this fails)
        run: npm run docs:reference && git diff --exit-code -- docs/04-api-reference.md
      - name: llms-full.txt is up to date (run `npm run llms` and commit if this fails)
        run: npm run llms && git diff --exit-code -- llms-full.txt
